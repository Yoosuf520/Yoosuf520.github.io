                <span className="px-3 py-1 rounded-full bg-cyan-500/10 border border-cyan-500/30 text-cyan-300 text-xs font-mono">
                  🤖 Interactive AI Portfolio Agent
                </span>
                <h2 className="text-2xl sm:text-3xl font-bold text-white">Ask Yoosuf's AI Copilot</h2>
                <p className="text-sm text-slate-300 leading-relaxed">
                  Have questions about Yoosuf's Multimodal RAG startup, MLOps pipelines, or ProYouth 2026 recognition? Click a prompt or ask below.
                </p>
                <div className="space-y-2 pt-2">
                  {[
                    "Tell me about Yoosuf's multilingual RAG startup.",
                    "How does he handle MLOps, DVC, and AWS deployment?",
                    "Tell me about his ProYouth 2026 AI Boot Camp certificate."
                  ].map((q, idx) => (
                    <button
                      key={idx}
                      onClick={() => handleSendCopilotQuery(q)}
                      className="w-full text-left p-3 rounded-xl bg-slate-900 hover:bg-slate-800 text-xs text-slate-200 border border-slate-800 transition-all flex items-center justify-between"
                    >
                      <span>{q}</span>
                      <span className="text-cyan-400">→</span>
                    </button>
                  ))}
                </div>
              </div>

              <div className="lg:col-span-7 rounded-2xl bg-[#0B1220] border border-slate-800 p-6 flex flex-col h-[420px] shadow-2xl">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
                  <div className="flex items-center gap-2">
                    <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse" />
                    <span className="text-xs font-mono text-slate-300">Yoosuf Portfolio Copilot (Grounded on CV)</span>
                  </div>
                  <span className="text-[11px] font-mono text-cyan-400">Active</span>
                </div>

                <div className="flex-1 overflow-y-auto space-y-3 pr-2">
                  {chatMessages.map((msg, idx) => (
                    <div key={idx} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                      <div
                        className={`max-w-[85%] p-3.5 rounded-xl text-xs leading-relaxed ${
                          msg.role === 'user'
                            ? 'bg-cyan-500 text-slate-950 font-semibold'
                            : 'bg-slate-900 text-slate-200 border border-slate-800'
                        }`}
                      >
                        {msg.text}
                      </div>
                    </div>
                  ))}
                </div>

                <div className="pt-3 mt-3 border-t border-slate-800 flex items-center gap-2">
                  <input
                    type="text"
                    value={chatInput}
                    onChange={(e) => setChatInput(e.target.value)}
                    onKeyDown={(e) => e.key === 'Enter' && handleSendCopilotQuery()}
                    placeholder="Ask about RAG, Qdrant, AWS, MLOps..."
                    className="flex-1 px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-800 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500"
                  />
                  <button
                    onClick={() => handleSendCopilotQuery()}
                    className="px-4 py-2.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-xs"
                  >
                    Send
                  </button>
                </div>
              </div>
            </section>

            {/* TECHNICAL SKILLS MATRIX */}
            <section id="skills" className="space-y-8 scroll-mt-20">
              <div>
                <span className="text-xs font-mono uppercase text-cyan-400">Updated CV Stack</span>
                <h2 className="text-2xl sm:text-3xl font-bold text-white mt-1">
                  Generative AI, MLOps & Data Science Capabilities
                </h2>
              </div>

              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                {portfolio.skillCategories.map((cat) => (
                  <div key={cat.id} className="rounded-2xl bg-slate-900/60 border border-slate-800 p-6 space-y-5">
                    <div className="flex items-center gap-2.5 border-b border-slate-800 pb-3">
                      <span className="text-lg">{cat.icon}</span>
                      <h3 className="font-bold text-white text-base">{cat.title}</h3>
                    </div>
                    <div className="space-y-4">
                      {cat.skills.map((skill, idx) => (
                        <div key={idx} className="space-y-1">
                          <div className="flex justify-between text-xs">
                            <span className="font-semibold text-slate-200">{skill.name}</span>
                            <span className="font-mono text-cyan-400">{skill.level}%</span>
                          </div>
                          <div className="w-full h-2 rounded-full bg-slate-950 overflow-hidden p-0.5 border border-slate-800">
                            <div
                              className="h-full rounded-full bg-gradient-to-r from-cyan-500 to-indigo-500"
                              style={{ width: `${skill.level}%` }}
                            />
                          </div>
                          <p className="text-[11px] font-mono text-slate-400">{skill.tag}</p>
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            </section>

            {/* HIGHLIGHTS & PROYOUTH 2026 CERTIFICATE */}
            <section id="highlights" className="space-y-8 scroll-mt-20">
              <div>
                <span className="text-xs font-mono uppercase text-amber-400">
                  Verified National Innovation Recognition
                </span>
                <h2 className="text-2xl sm:text-3xl font-bold text-white mt-1">
                  #Proyouth 2026 AI Boot Camp, Awards & Education
                </h2>
              </div>

              <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                <div className="lg:col-span-7 space-y-4">
                  {portfolio.highlights.map((item, idx) => (
                    <div
                      key={idx}
                      className={`p-6 rounded-2xl border space-y-2 ${
                        item.hasCertificate
                          ? 'bg-gradient-to-br from-amber-500/10 via-slate-900 to-slate-900 border-amber-500/40'
                          : 'bg-slate-900/60 border-slate-800'
                      }`}
                    >
                      <div className="flex items-center justify-between">
                        <span className="text-xs font-mono text-cyan-400 bg-cyan-500/10 px-2.5 py-1 rounded-md">
                          {item.year}
                        </span>
                        <span className="text-xs font-mono text-amber-300 bg-amber-500/10 px-2.5 py-0.5 rounded-full border border-amber-500/20">
                          {item.badge}
                        </span>
                      </div>
                      <h3 className="text-lg font-bold text-white">{item.title}</h3>
                      <div className="text-xs text-slate-400">{item.org}</div>
                      <p className="text-sm text-slate-300 leading-relaxed">{item.description}</p>
                      {item.hasCertificate && (
                        <div className="pt-2">
                          <button
                            onClick={() => setIsCertModalOpen(true)}
                            className="px-3.5 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs"
                          >
                            📜 Inspect Full Certificate
                          </button>
                        </div>
                      )}
                    </div>
                  ))}
                </div>

                {/* Certificate Preview Card */}
                <div className="lg:col-span-5">
                  <div className="rounded-2xl bg-slate-900 border border-amber-500/40 p-5 space-y-4 shadow-2xl">
                    <div className="flex items-center justify-between">
                      <span className="text-sm font-bold text-amber-300">
                        📜 Official ProYouth 2026 Certificate
                      </span>
                      <label className="px-3 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-cyan-300 border border-cyan-500/30 text-xs font-medium cursor-pointer">
                        <span>Load Certificate JPEG</span>
                        <input type="file" accept="image/*" onChange={handleCertificateUpload} className="hidden" />
                      </label>
                    </div>

                    {!certImgError && portfolio.certificateDetails.imageUrl ? (
                      <img
                        src={portfolio.certificateDetails.imageUrl}
                        alt="ProYouth 2026 Certificate"
                        onError={() => setCertImgError(true)}
                        onClick={() => setIsCertModalOpen(true)}
                        className="w-full rounded-xl border border-slate-700 cursor-pointer bg-white"
                      />
                    ) : (
                      <div
                        onClick={() => setIsCertModalOpen(true)}
                        className="rounded-xl bg-white text-slate-900 p-6 border-2 border-amber-400 cursor-pointer space-y-3"
                      >
                        <div className="flex items-center justify-between border-b pb-2">
                          <span className="font-black text-xs text-slate-900">
                            NIA — NATIONAL INNOVATION AGENCY
                          </span>
                          <span className="px-2 py-0.5 bg-red-600 text-white font-bold text-[10px] rounded">
                            NPS SRI LANKA
                          </span>
                        </div>
                        <div className="text-center space-y-1.5 py-2">
                          <p className="text-xs text-slate-600">This is to certify that</p>
                          <p className="text-base font-black text-slate-950 border-b border-dotted border-slate-400 pb-1">
                            M.A YOOSUF AHAMED
                          </p>
                          <p className="text-xs text-slate-600">has successfully completed the</p>
                          <p className="text-base font-extrabold text-slate-950">
                            Artificial Intelligence Boot Camp
                          </p>
                          <p className="text-xs text-slate-700">held on 9–10 September 2026</p>
                        </div>
                        <p className="text-[11px] italic text-slate-700 text-center">
                          Organized by the National Innovation Agency Sri Lanka in collaboration with
                          National Productivity Secretariat, as an element of the #Proyouth 2026 Competition.
                        </p>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            </section>

            {/* ACADEMIC REFERENCES */}
            <section id="references" className="space-y-6 scroll-mt-20">
              <div>
                <span className="text-xs font-mono uppercase text-cyan-400">Verified CV References</span>
                <h2 className="text-2xl sm:text-3xl font-bold text-white mt-1">
                  Academic References (Lincoln Institute of Graduate Studies)
                </h2>
              </div>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                {portfolio.references.map((ref, i) => (
                  <div key={i} className="p-6 rounded-2xl bg-slate-900/60 border border-slate-800 space-y-1">
                    <h3 className="text-lg font-bold text-white">{ref.name}</h3>
                    <p className="text-sm text-cyan-300">{ref.role}</p>
                    <p className="text-xs text-slate-400">{ref.institution}</p>
                    <p className="text-xs font-mono text-emerald-400 pt-2">📞 {ref.phone}</p>
                  </div>
                ))}
              </div>
            </section>

            {/* CONTACT & DIRECT MESSAGE SECTION */}
            <section id="contact" className="rounded-2xl bg-slate-900/80 border border-slate-800 p-6 sm:p-10 space-y-8 shadow-2xl scroll-mt-20">
              <div className="max-w-2xl">
                <span className="text-xs font-mono uppercase text-cyan-400">Get in Touch</span>
                <h2 className="text-2xl sm:text-3xl font-bold text-white mt-1">
                  Let's Build Something Exceptional Together
                </h2>
                <p className="text-sm text-slate-300 mt-2">
                  Whether you are hiring for AI/ML engineering, MLOps, or Data Science roles, feel free to send a direct message below.
                </p>
              </div>

              <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                <div className="lg:col-span-5 space-y-4">
                  <div className="p-5 rounded-xl bg-slate-950 border border-slate-800 space-y-4 text-sm">
                    <div>
                      <div className="text-xs text-slate-400">Direct Email</div>
                      <div className="font-bold text-white">{portfolio.profile.email}</div>
                    </div>
                    <div>
                      <div className="text-xs text-slate-400">Phone / WhatsApp</div>
                      <div className="font-bold text-white">{portfolio.profile.phone}</div>
                    </div>
                    <div>
                      <div className="text-xs text-slate-400">Location</div>
                      <div className="font-bold text-white">{portfolio.profile.location}</div>
                    </div>
                  </div>
                </div>

                <div className="lg:col-span-7">
                  {messageSubmitted ? (
                    <div className="p-8 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-center space-y-3">
                      <div className="text-3xl">✅</div>
                      <h3 className="text-lg font-bold text-white">Message Sent Successfully!</h3>
                      <p className="text-xs text-slate-300">
                        Your message has been delivered directly to {portfolio.profile.email}. Yoosuf will get back to you shortly!
                      </p>
                      <button
                        onClick={() => setMessageSubmitted(false)}
                        className="px-4 py-2 rounded-lg bg-slate-800 text-xs font-semibold text-white"
                      >
                        Send Another Message
                      </button>
                    </div>
                  ) : (
                    <form onSubmit={handleContactSubmit} className="space-y-4">
                      <div className="flex items-center justify-between">
                        <span className="text-xs font-mono text-cyan-400">Direct Inquiry Form</span>
                        <button
                          type="button"
                          onClick={handleAutoDraftMessage}
                          className="px-3 py-1 rounded-lg bg-cyan-500/20 hover:bg-cyan-500/30 text-cyan-300 border border-cyan-500/40 text-xs font-semibold"
                        >
                          ✨ Auto-Draft Message
                        </button>
                      </div>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <input
                          type="text"
                          required
                          placeholder="Your Name"
                          value={contactForm.name}
                          onChange={(e) => setContactForm({ ...contactForm, name: e.target.value })}
                          className="px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-sm text-white placeholder-slate-500"
                        />
                        <input
                          type="email"
                          required
                          placeholder="Your Email"
                          value={contactForm.email}
                          onChange={(e) => setContactForm({ ...contactForm, email: e.target.value })}
                          className="px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-sm text-white placeholder-slate-500"
                        />
                      </div>
                      <select
                        value={contactForm.subject}
                        onChange={(e) => setContactForm({ ...contactForm, subject: e.target.value })}
                        className="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-sm text-white"
                      >
                        <option value="AI / ML Engineering Opportunity">AI / ML Engineering Opportunity</option>
                        <option value="GenAI & RAG Collaboration">GenAI & RAG Collaboration</option>
                        <option value="Cloud MLOps & DevOps Role">Cloud MLOps & DevOps Role</option>
                        <option value="General Professional Inquiry">General Professional Inquiry</option>
                      </select>
                      <textarea
                        rows={4}
                        required
                        placeholder="Your message..."
                        value={contactForm.message}
                        onChange={(e) => setContactForm({ ...contactForm, message: e.target.value })}
                        className="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-sm text-white placeholder-slate-500"
                      />
                      <button
                        type="submit"
                        disabled={isSendingMessage}
                        className="w-full py-3.5 rounded-xl bg-gradient-to-r from-cyan-500 to-indigo-600 hover:from-cyan-400 hover:to-indigo-500 text-slate-950 font-bold text-sm shadow-lg disabled:opacity-50"
                      >
                        {isSendingMessage ? "Sending directly to Yoosuf's Inbox..." : "Send Direct Message 🚀"}
                      </button>
                    </form>
                  )}
                </div>
              </div>
            </section>
          </main>

          {/* PROJECT ARCHITECTURE MODAL */}
          {selectedProject && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-[#0B1220] border border-slate-700 rounded-2xl max-w-2xl w-full p-6 sm:p-8 space-y-5 max-h-[90vh] overflow-y-auto">
                <div className="flex items-start justify-between">
                  <div>
                    <span className="text-xs font-mono text-cyan-400">{selectedProject.status}</span>
                    <h3 className="text-2xl font-bold text-white mt-1">{selectedProject.title}</h3>
                  </div>
                  <button
                    onClick={() => setSelectedProject(null)}
                    className="px-3 py-1 rounded-lg bg-slate-800 text-slate-300 hover:text-white text-xs"
                  >
                    ✕ Close
                  </button>
                </div>

                <div className="p-4 rounded-xl bg-slate-900 border border-slate-800">
                  <div className="text-xs font-mono text-amber-400 uppercase mb-1">Problem Statement</div>
                  <p className="text-sm text-slate-300">{selectedProject.problem}</p>
                </div>

                <div className="space-y-2">
                  <div className="text-xs font-mono text-cyan-400 uppercase">Architecture & Engineering</div>
                  <ul className="space-y-2">
                    {selectedProject.architecture.map((pt, i) => (
                      <li key={i} className="text-sm text-slate-200 flex items-start gap-2">
                        <span className="text-emerald-400">✓</span>
                        <span>{pt}</span>
                      </li>
                    ))}
                  </ul>
                </div>

                <div className="flex flex-wrap gap-2 pt-2">
                  {selectedProject.tech.map((t, idx) => (
                    <span key={idx} className="px-3 py-1 rounded-lg bg-slate-900 border border-slate-700 text-xs font-mono text-cyan-300">
                      {t}
                    </span>
                  ))}
                </div>

                <div className="pt-4 border-t border-slate-800 flex justify-end">
                  <a
                    href={selectedProject.githubUrl}
                    target="_blank"
                    rel="noreferrer"
                    className="px-4 py-2 rounded-xl bg-cyan-500 text-slate-950 font-bold text-xs"
                  >
                    View Repository on GitHub ↗
                  </a>
                </div>
              </div>
            </div>
          )}

          {/* CERTIFICATE FULL-SCREEN MODAL */}
          {isCertModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-[#0B1220] border border-amber-500/40 rounded-2xl max-w-3xl w-full p-6 space-y-4 max-h-[92vh] overflow-y-auto">
                <div className="flex items-center justify-between">
                  <h3 className="text-lg font-bold text-white">
                    Artificial Intelligence Boot Camp — #Proyouth 2026 Certificate
                  </h3>
                  <button
                    onClick={() => setIsCertModalOpen(false)}
                    className="px-3 py-1 rounded-lg bg-slate-800 text-slate-300 hover:text-white text-xs"
                  >
                    ✕ Close
                  </button>
                </div>
                {!certImgError && portfolio.certificateDetails.imageUrl ? (
                  <img
                    src={portfolio.certificateDetails.imageUrl}
                    alt="ProYouth 2026 Certificate"
                    onError={() => setCertImgError(true)}
                    className="w-full rounded-xl bg-white"
                  />
                ) : (
                  <div className="p-8 rounded-xl bg-white text-slate-900 text-center space-y-3 border-4 border-amber-500/40">
                    <div className="font-black text-lg">NATIONAL INNOVATION AGENCY (NIA) & NPS SRI LANKA</div>
                    <p className="text-sm">This is to certify that</p>
                    <div className="text-2xl font-black underline">M.A YOOSUF AHAMED</div>
                    <p className="text-sm">has successfully completed the</p>
                    <div className="text-xl font-extrabold">Artificial Intelligence Boot Camp</div>
                    <div className="text-xs font-semibold">held on 9–10 September 2026 (#Proyouth 2026 Competition)</div>
                    <div className="flex justify-between border-t pt-4 text-xs text-slate-700 mt-4">
                      <div>
                        <div className="font-bold">Mr W.M.D. Suranga Gunarathna</div>
                        <div>Director General, NPS</div>
                      </div>
                      <div className="text-right">
                        <div className="font-bold">Dr Muditha D. Senarath Yapa</div>
                        <div>Chief Innovation Officer, NIA</div>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
